name: Reviewed policy target
on:
  push:
    branches: [codex/core-policy-target-review]
    paths: [.github/workflows/core-policy-target-review.yml]
permissions: {}
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    permissions: {actions: read, contents: read, pull-requests: read, issues: read}
    steps:
      - uses: faberline/aw/.github/actions/policy-adoption-target-review@17bbd9ff1824e9e1e7daf935b9f23d3a397a4aee
        with:
          target-pr: '75'
          target-head: ae3cd59c67acacd2117ef2cb31090e5f71e7e8ae
          claude-token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
  outcome:
    needs: review
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency: {group: issue-ci-handoff, cancel-in-progress: false}
    permissions: {actions: read, contents: write, pull-requests: write, statuses: write, issues: write}
    steps:
      - uses: faberline/aw/.github/actions/policy-adoption-review-outcome@17bbd9ff1824e9e1e7daf935b9f23d3a397a4aee
        with:
          target-pr: '75'
          target-head: ae3cd59c67acacd2117ef2cb31090e5f71e7e8ae
          review-run: ${{ github.run_id }}
