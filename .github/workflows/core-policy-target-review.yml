name: Reviewed policy target
on:
  push:
    branches: [codex/core-policy-target-review]
    paths: [.github/workflows/core-policy-target-review.yml]
permissions: {}
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    permissions: {actions: read, contents: read, pull-requests: read, issues: read}
    steps:
      - uses: faberline/aw/.github/actions/policy-adoption-target-review@9ce4b2ead3a3ee33ec8500e4cf8fbd025b7d85fd
        with:
          target-pr: '75'
          target-head: 44b3cc54b65fea8e57bbc6352eb8f2e88d85fb3a
          claude-token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
  outcome:
    needs: review
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency: {group: issue-ci-handoff, cancel-in-progress: false}
    permissions: {actions: read, contents: write, pull-requests: write, statuses: write, issues: write}
    steps:
      - uses: faberline/aw/.github/actions/policy-adoption-review-outcome@9ce4b2ead3a3ee33ec8500e4cf8fbd025b7d85fd
        with:
          target-pr: '75'
          target-head: 44b3cc54b65fea8e57bbc6352eb8f2e88d85fb3a
          review-run: ${{ github.run_id }}
