name: Reviewed policy target
on:
  push:
    branches: [codex/core-policy-target-review]
    paths: [.github/workflows/core-policy-target-review.yml]
permissions: {}
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    permissions: {actions: read, contents: read, pull-requests: read, issues: read}
    steps:
      - uses: faberline/aw/.github/actions/policy-adoption-target-review@ae15be60678d27c407c1873866892505bb089e17
        with:
          target-pr: '75'
          target-head: 870c45c7037140a7846842aaeecb2e0e21d47c36
          claude-token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
  outcome:
    needs: review
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency: {group: issue-ci-handoff, cancel-in-progress: false}
    permissions: {actions: read, contents: write, pull-requests: write, statuses: write, issues: write}
    steps:
      - uses: faberline/aw/.github/actions/policy-adoption-review-outcome@ae15be60678d27c407c1873866892505bb089e17
        with:
          target-pr: '75'
          target-head: 870c45c7037140a7846842aaeecb2e0e21d47c36
          review-run: ${{ github.run_id }}
