name: Reviewed policy target
on:
  push:
    branches: [codex/core87-policy-target-review]
    paths: [.github/workflows/core-policy-target-review.yml]
permissions: {}
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    permissions: {actions: read, contents: read, pull-requests: read, issues: read}
    steps:
      - uses: faberline/aw/.github/actions/policy-adoption-target-review@c929e87e50cd2c5e7d578c4b44e002182291031a
        with:
          target-pr: '87'
          target-head: 54c45152ef6681c43cb67e03e3535b0b8635fddf
          claude-token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
  outcome:
    needs: review
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency: {group: issue-ci-handoff, cancel-in-progress: false}
    permissions: {actions: read, contents: write, pull-requests: write, statuses: write, issues: write}
    steps:
      - uses: faberline/aw/.github/actions/policy-adoption-review-outcome@c929e87e50cd2c5e7d578c4b44e002182291031a
        with:
          target-pr: '87'
          target-head: 54c45152ef6681c43cb67e03e3535b0b8635fddf
          review-run: ${{ github.run_id }}
