name: Core development CI

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review, edited]

permissions:
  contents: read
  pull-requests: read
  issues: read

concurrency:
  group: core-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  development-preflight:
    name: development preflight
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      base: ${{ steps.preflight.outputs.base }}
      head: ${{ steps.preflight.outputs.head }}
      issue: ${{ steps.preflight.outputs.issue }}
    steps:
      - name: Check main freshness, conflicts and canonical issue
        uses: faberline/aw/.github/actions/issue-ci@fb002d9198967313a4641f129a9c9648890a7555
        id: preflight
        with:
          operation: development-preflight
          pr: ${{ github.event.pull_request.number }}
          head: ${{ github.event.pull_request.head.sha }}
          base: ${{ github.event.pull_request.base.sha }}

  unit-plan:
    needs: development-preflight
    name: candidate workspace unit inventory
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      contracts: ${{ steps.contracts.outputs.matrix }}
      impact: ${{ steps.impact.outputs.result }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable
      - name: Prepare isolated hash-locked metadata controls
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/core-plan-python"
          "$RUNNER_TEMP/core-plan-python/bin/python" -m pip --isolated install --disable-pip-version-check --no-input --no-deps --only-binary=:all: --require-hashes --index-url https://pypi.org/simple -r candidate/scripts/issue-ci/readiness-requirements.txt
          echo "$RUNNER_TEMP/core-plan-python/bin" >> "$GITHUB_PATH"
      - name: Check nonempty PR gate fixtures
        working-directory: candidate
        run: |
          python3 -c 'import sys,unittest; suite=unittest.TestSuite([unittest.defaultTestLoader.discover("scripts/pr-gates/tests"),unittest.defaultTestLoader.discover("scripts/issue-ci/tests",top_level_dir="scripts/issue-ci/tests")]); count=suite.countTestCases(); print("fixture_count="+str(count)); result=unittest.TextTestRunner(verbosity=2).run(suite); sys.exit(0 if count > 0 and result.wasSuccessful() and not result.skipped else 1)'
      - name: Derive complete current-head matrix and baseline inventory
        id: plan
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          EXPECTED_BASE: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -c 'import sys; sys.exit(0 if sys.version_info >= (3, 11) else "Python 3.11+ required")'
          python3 candidate/scripts/pr-gates/plan.py inventory --root candidate --baseline-root trusted --expected-head "$EXPECTED_HEAD" --expected-base "$EXPECTED_BASE"
          matrix=$(python3 candidate/scripts/pr-gates/batches.py matrix --group unit --root candidate --baseline-root trusted --expected-head "$EXPECTED_HEAD" --expected-base "$EXPECTED_BASE")
          printf 'matrix=%s\n' "$matrix" >> "$GITHUB_OUTPUT"

      - name: Record changed paths and reverse dependency impact
        id: impact
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          EXPECTED_BASE: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          set -euo pipefail
          impact=$(python3 candidate/scripts/pr-gates/plan.py impact --root candidate --baseline-root trusted --expected-head "$EXPECTED_HEAD" --expected-base "$EXPECTED_BASE")
          printf 'result=%s\n' "$impact" >> "$GITHUB_OUTPUT"

      - name: Derive every enabled integration target and feature row
        id: contracts
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          EXPECTED_BASE: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          set -euo pipefail
          matrix=$(python3 candidate/scripts/pr-gates/batches.py matrix --group functional --root candidate --baseline-root trusted --expected-head "$EXPECTED_HEAD" --expected-base "$EXPECTED_BASE")
          printf 'matrix=%s\n' "$matrix" >> "$GITHUB_OUTPUT"

  workspace-static:
    needs: unit-plan
    name: candidate static checks
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable
          components: rustfmt
      - name: Check complete workspace formatting
        run: cargo fmt --all -- --check
      - name: Inspect exact-head issue contract as untrusted data
        uses: faberline/aw/.github/actions/issue-contract@fb002d9198967313a4641f129a9c9648890a7555

  workspace-unit-static:
    name: candidate unit batch (${{ matrix.batch }})
    if: github.event_name == 'pull_request'
    needs: unit-plan
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.unit-plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: candidate -> target
          shared-key: pr-unit-batch-${{ matrix.batch }}
          cache-on-failure: true
          cache-workspace-crates: false
      - name: Install generated Python client test dependency
        if: matrix.openapi
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/pr-gates-python"
          "$RUNNER_TEMP/pr-gates-python/bin/python" -m pip install 'pydantic>=2,<3'
          "$RUNNER_TEMP/pr-gates-python/bin/python" -m pip freeze
          "$RUNNER_TEMP/pr-gates-python/bin/python" -c 'import pydantic; assert pydantic.__version__.split(".")[0] == "2"'
          echo "$RUNNER_TEMP/pr-gates-python/bin" >> "$GITHUB_PATH"
      - name: Run every assigned unit, Clippy and documentation case
        env:
          BATCH: ${{ matrix.batch }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          EXPECTED_BASE: ${{ github.event.pull_request.base.sha }}
          CARGO_INCREMENTAL: "0"
        run: python3 candidate/scripts/pr-gates/batches.py run --group unit --batch "$BATCH" --root candidate --baseline-root trusted --expected-head "$EXPECTED_HEAD" --expected-base "$EXPECTED_BASE"

  workspace-contracts:
    name: candidate functional batch (${{ matrix.batch }})
    if: github.event_name == 'pull_request'
    needs: [unit-plan, workspace-static, workspace-unit-static]
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.unit-plan.outputs.contracts) }}
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: candidate -> target
          shared-key: pr-functional-batch-${{ matrix.batch }}
          cache-on-failure: true
          cache-workspace-crates: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        if: matrix.openapi
      - name: Require external compiler and runtime tools
        if: matrix.openapi
        shell: bash
        run: |
          set -euo pipefail
          node --version
          npm --version
          uv --version
          python3 -m venv "$RUNNER_TEMP/pr-contracts-python"
          "$RUNNER_TEMP/pr-contracts-python/bin/python" -m pip install 'pydantic>=2,<3'
          "$RUNNER_TEMP/pr-contracts-python/bin/python" -m pip freeze
          echo "$RUNNER_TEMP/pr-contracts-python/bin" >> "$GITHUB_PATH"
          cp -R candidate/scripts/pr-gates/generated-rust-dependencies "$RUNNER_TEMP/generated-rust-dependencies"
          cargo fetch --manifest-path "$RUNNER_TEMP/generated-rust-dependencies/Cargo.toml"
          sha256sum "$RUNNER_TEMP/generated-rust-dependencies/Cargo.lock"
      - name: Install pinned Kind for fresh per-case live clusters
        if: matrix.kind
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error -o "$RUNNER_TEMP/kind" https://github.com/kubernetes-sigs/kind/releases/download/v0.29.0/kind-linux-amd64
          echo "c72eda46430f065fb45c5f70e7c957cc9209402ef309294821978677c8fb3284  $RUNNER_TEMP/kind" | sha256sum --check --strict
          chmod +x "$RUNNER_TEMP/kind"
      - name: Run every assigned integration, legacy and Raft source-issue case
        env:
          BATCH: ${{ matrix.batch }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          EXPECTED_BASE: ${{ github.event.pull_request.base.sha }}
        run: python3 candidate/scripts/pr-gates/batches.py run --group functional --batch "$BATCH" --root candidate --baseline-root trusted --expected-head "$EXPECTED_HEAD" --expected-base "$EXPECTED_BASE"
      - name: Recover disposable Kind cluster after interruption
        if: ${{ always() && matrix.kind }}
        run: '"$RUNNER_TEMP/kind" delete cluster --name core-contracts'

  measured-performance:
    needs: [workspace-static, workspace-unit-static]
    name: candidate measured performance
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: candidate -> target
          shared-key: pr-measured-performance
          cache-on-failure: true
          cache-workspace-crates: false
      - name: Install generated Python client runtime dependency
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/pr-measure-python"
          "$RUNNER_TEMP/pr-measure-python/bin/python" -m pip install 'pydantic>=2,<3'
          "$RUNNER_TEMP/pr-measure-python/bin/python" -m pip freeze
          echo "$RUNNER_TEMP/pr-measure-python/bin" >> "$GITHUB_PATH"
      - name: Retain measured workloads and original thresholds
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          EXPECTED_BASE: ${{ github.event.pull_request.base.sha }}
        run: python3 candidate/scripts/pr-gates/measure.py --root candidate --baseline-root trusted --expected-head "$EXPECTED_HEAD" --expected-base "$EXPECTED_BASE"
