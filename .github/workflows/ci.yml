name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_INCREMENTAL: "0"

jobs:
  lint:
    name: "lint: fmt and clippy"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check ci.yml shape
        run: bash ci/check-ci-shape.sh
      - name: Test ci.yml shape check
        run: bash ci/test-check-ci-shape.sh
      - name: Check the toolchain pin
        run: bash ci/check-toolchain-pin.sh
      - name: Test the toolchain pin check
        run: bash ci/test-check-toolchain-pin.sh
      - name: Check ignored tests have a reason
        run: bash ci/check-ignore-reasons.sh
      - name: Test the ignored-test reason check
        run: bash ci/test-check-ignore-reasons.sh
      - name: Check the stability promise
        run: bash ci/check-stability-promise.sh
      - name: Test the stability promise check
        run: bash ci/test-check-stability-promise.sh
      - name: Check release.yml shape
        run: |
          bash ci/check-release-shape.sh
          bash ci/test-check-release-shape.sh
      - name: Check feature rows
        run: bash ci/test-feature-rows.sh
      - name: Test the job selection
        run: bash ci/test-select-jobs.sh
      - name: Test the kind rows runner
        run: bash ci/test-run-kind-rows.sh
      - name: Check release policy
        run: |
          python3 ci/check-release-policy.py
          python3 -m unittest ci/test_check_release_policy.py
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          shared-key: ci-lint
          cache-on-failure: true
          cache-workspace-crates: false
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test-select:
    name: "test: select jobs"
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      lint: ${{ steps.select.outputs.lint }}
      test-workspace: ${{ steps.select.outputs.test-workspace }}
      test-service-backup: ${{ steps.select.outputs.test-service-backup }}
      test-service-k8s: ${{ steps.select.outputs.test-service-k8s }}
      test-openapi-codegen: ${{ steps.select.outputs.test-openapi-codegen }}
      test-feature-rows: ${{ steps.select.outputs.test-feature-rows }}
      test-coverage: ${{ steps.select.outputs.test-coverage }}
      e2e-service-k8s: ${{ steps.select.outputs.e2e-service-k8s }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select the jobs for the changed files
        id: select
        run: |
          set -euo pipefail
          json="$(bash ci/select-jobs.sh)"
          echo "$json"
          echo "$json" | jq -r 'to_entries[] | "\(.key)=\(.value)"' >> "$GITHUB_OUTPUT"

  test-workspace:
    name: "test: workspace"
    needs: [lint, test-select]
    if: needs.test-select.outputs.test-workspace == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Supply the workspace root to legacy EC contract probes
        run: mkdir -p .aw
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.99.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          shared-key: ci-test-workspace
          cache-on-failure: true
          cache-workspace-crates: false
      - run: cargo test --workspace --locked --exclude service-k8s --exclude openapi-codegen --exclude service-backup -- --include-ignored

  test-service-backup:
    name: "test: service-backup"
    needs: [lint, test-select]
    if: needs.test-select.outputs.test-service-backup == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Supply the workspace root to legacy EC contract probes
        run: mkdir -p .aw
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.99.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          shared-key: ci-test-service-backup
          cache-on-failure: true
          cache-workspace-crates: false
      - run: cargo test --locked -p service-backup --features http-client -- --include-ignored

  test-service-k8s:
    name: "test: service-k8s"
    needs: [lint, test-select]
    if: needs.test-select.outputs.test-service-k8s == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Supply the workspace root to legacy EC contract probes
        run: mkdir -p .aw
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.99.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          shared-key: ci-test-service-k8s
          cache-on-failure: true
          cache-workspace-crates: false
      - run: cargo test --locked -p service-k8s

  test-openapi-codegen:
    name: "test: openapi-codegen"
    needs: [lint, test-select]
    if: needs.test-select.outputs.test-openapi-codegen == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Supply the workspace root to legacy EC contract probes
        run: mkdir -p .aw
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.99.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          shared-key: ci-test-openapi-codegen
          cache-on-failure: true
          cache-workspace-crates: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
      - name: Require external compiler and runtime tools
        shell: bash
        run: |
          set -euo pipefail
          node --version
          npm --version
          uv --version
          python3 -m venv "$RUNNER_TEMP/ci-python"
          "$RUNNER_TEMP/ci-python/bin/python" -m pip install 'pydantic>=2,<3'
          "$RUNNER_TEMP/ci-python/bin/python" -m pip freeze
          echo "$RUNNER_TEMP/ci-python/bin" >> "$GITHUB_PATH"
          cp -R ci/generated-rust-dependencies "$RUNNER_TEMP/generated-rust-dependencies"
          cargo fetch --locked --manifest-path "$RUNNER_TEMP/generated-rust-dependencies/Cargo.toml"
          sha256sum "$RUNNER_TEMP/generated-rust-dependencies/Cargo.lock"
      - run: cargo test --locked -p openapi-codegen -- --include-ignored

  test-feature-rows:
    name: "test: feature rows (${{ matrix.group }})"
    needs: [lint, test-select]
    if: needs.test-select.outputs.test-feature-rows == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { group: group-a, packages: "service-backup ui-runtime" }
          - { group: group-b, packages: "storage-object cli-std index-text" }
          - { group: group-c, packages: "service-http service-auth transport-h2c service-observability" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Supply the workspace root to legacy EC contract probes
        run: mkdir -p .aw
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.99.1
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          shared-key: ci-test-feature-rows
          cache-on-failure: true
          cache-workspace-crates: false
      - name: Run the feature rows of ${{ matrix.group }}
        run: bash ci/run-feature-group.sh ${{ matrix.packages }}

  test-coverage:
    name: "test: workspace, coverage"
    needs: [lint, test-select]
    if: needs.test-select.outputs.test-coverage == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Supply the workspace root to legacy EC contract probes
        run: mkdir -p .aw
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.99.1
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          shared-key: ci-test-coverage
          cache-on-failure: true
          cache-workspace-crates: false
      - uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: cargo-llvm-cov@0.9.1
      - run: cargo llvm-cov --workspace --locked --exclude service-k8s --exclude openapi-codegen --exclude service-backup --json --summary-only --output-path target/coverage.json -- --include-ignored
      - uses: faberline/aw/.github/actions/coverage@49df274a62a227fd7b6f635f4ebf3ed4e81df349 # S8
        with:
          summary: target/coverage.json
      - name: Negative test, the ratchet must fail on COV3 when line is above the measurement
        env:
          GH_TOKEN: ${{ github.token }}
          COVERAGE_ROOT: ${{ github.workspace }}
          GITHUB_STEP_SUMMARY: /dev/null
        run: |
          set -euo pipefail
          gh api -H 'Accept: application/vnd.github.raw' 'repos/faberline/aw/contents/.github/actions/coverage/check.sh?ref=49df274a62a227fd7b6f635f4ebf3ed4e81df349' > "$RUNNER_TEMP/check.sh"
          chmod +x "$RUNNER_TEMP/check.sh"
          sed -E 's/^line = [0-9.]+.*/line = 100.00/' aw.toml > "$RUNNER_TEMP/aw-raised.toml"
          status=0
          "$RUNNER_TEMP/check.sh" target/coverage.json "$RUNNER_TEMP/aw-raised.toml" > "$RUNNER_TEMP/coverage-negative.json" || status=$?
          test "$status" = 1
          jq -e 'any(.findings[]; .check == "COV3" and .status == "fail")' "$RUNNER_TEMP/coverage-negative.json"

  e2e-service-k8s:
    name: "e2e: service-k8s kind (${{ matrix.group }})"
    needs: [test-select, test-workspace, test-service-backup, test-service-k8s, test-openapi-codegen, test-feature-rows]
    if: ${{ !cancelled() && needs.test-select.outputs.e2e-service-k8s == 'true' && !contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SERVICE_K8S_LIVE_KUBE: "1"
    strategy:
      fail-fast: false
      matrix:
        include:
          - { group: group-a, profiles: "default all-features no-default" }
          - { group: group-b, profiles: "feature:certificate feature:controller feature:full" }
          - { group: group-c, profiles: "feature:gcp-cas feature:gcp-cas-client feature:render-only" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Supply the workspace root to legacy EC contract probes
        run: mkdir -p .aw
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.99.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          shared-key: ci-e2e-service-k8s
          cache-on-failure: true
          cache-workspace-crates: false
      - name: Create disposable kind cluster
        uses: faberline/aw/.github/actions/kind@5a04bb391f9c6df1df7b34a532874a86d783801d
        with:
          name: core-contracts
      - name: Verify the disposable kind context
        shell: bash
        run: |
          set -euo pipefail
          kubectl config current-context
          test "$(kubectl config current-context)" = kind-core-contracts
          kubectl get nodes
      - name: Run the kind rows of ${{ matrix.group }}
        run: bash ci/run-kind-rows.sh ${{ matrix.profiles }}
      - name: Remove disposable kind cluster
        if: always()
        shell: bash
        run: 'kind delete cluster --name core-contracts'

  gate:
    name: gate
    if: always()
    needs: [lint, test-select, test-workspace, test-service-backup, test-service-k8s, test-openapi-codegen, test-feature-rows, test-coverage, e2e-service-k8s]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # A job is selected when its group output is true (lint and test-select always are).
      # A selected job must succeed. A job that the map did not select must be skipped.
      # On push, workflow_dispatch and workflow_call every group is true.
      - name: Check every stage
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$RESULTS" | jq -e '.lint.result == "success"' > /dev/null
          echo "$RESULTS" | jq -e 'all(.[]; .result == "success" or .result == "skipped")' > /dev/null
      - name: Check every job against the map
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          echo "$RESULTS" | jq -r '
            (.["test-select"].outputs // {}) as $o
            | to_entries[]
            | .key as $k
            | (($k == "lint") or ($k == "test-select") or ($o[$k] == "true")) as $sel
            | if $sel and .value.result == "success" then "\($k): selected success"
              elif ($sel | not) and .value.result == "skipped" then "\($k): skipped by map"
              else "FAIL \($k): \(if $sel then "selected" else "not selected" end), result \(.value.result)" end' | tee "$RUNNER_TEMP/gate.txt"
          ! grep -q '^FAIL ' "$RUNNER_TEMP/gate.txt"
