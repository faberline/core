name: core ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      ref:
        description: Commit, tag, or branch to test.
        required: false
        type: string

permissions:
  contents: read
  pull-requests: read
  issues: read

concurrency:
  group: core-ci-${{ github.ref }}-${{ inputs.ref }}
  cancel-in-progress: true

jobs:
  crate-gates:
    name: ${{ matrix.crate }}
    needs: unit-stage
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - crate: service-k8s
            args: -p service-k8s
          - crate: storage-durable
            args: -p storage-durable
          - crate: service-backup
            args: -p service-backup --features http-client
          - crate: raft-core
            args: -p raft-core
          - crate: raft-runtime
            args: -p raft-runtime
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: Run crate tests
        env:
          CARGO_INCREMENTAL: "0"
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked ${{ matrix.args }}

  source-issue-47-unit:
    name: candidate issue 47 (clippy)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable
          components: clippy
      - name: Run Raft runtime all-target Clippy
        run: cargo clippy --locked -p raft-runtime --all-targets -- -D warnings

  source-issue-47-integration:
    name: candidate issue 47 (${{ matrix.gate }})
    if: github.event_name == 'pull_request'
    needs: unit-stage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        gate: [proposal, raft-full]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable
          components: clippy
      - name: Run exact proposal filter and verify its selected roster
        if: matrix.gate == 'proposal'
        run: python3 scripts/pr-gates/proposal_gate.py
      - name: Run both Raft packages without fail-fast
        if: matrix.gate == 'raft-full'
        run: cargo test --locked -p raft-core -p raft-runtime --no-fail-fast


  issue-contract-inspection:
    name: candidate source issue contract inspection
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Inspect exact-head issue contract as untrusted data
        uses: faberline/aw/.github/actions/issue-contract@8e2e93e5ba8feb30b6668de39139980ea3bb085c

  # Ordinary read-only PR tests execute candidate code, as the legacy crate
  # jobs do. They do not approve trusted qualification. That independent
  # policy, immutable identity review and failure-only boundary are unchanged.
  unit-plan:
    name: candidate workspace unit inventory
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      contracts: ${{ steps.contracts.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable
      - name: Check nonempty PR gate fixtures
        working-directory: candidate
        run: |
          python3 -c 'import sys,unittest; suite=unittest.TestSuite([unittest.defaultTestLoader.discover("scripts/pr-gates/tests"),unittest.defaultTestLoader.discover("scripts/issue-ci/tests",top_level_dir="scripts/issue-ci/tests")]); count=suite.countTestCases(); print("fixture_count="+str(count)); result=unittest.TextTestRunner(verbosity=2).run(suite); sys.exit(0 if count > 0 and result.wasSuccessful() and not result.skipped else 1)'
      - name: Derive complete current-head matrix and baseline inventory
        id: plan
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          EXPECTED_BASE: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -c 'import sys; sys.exit(0 if sys.version_info >= (3, 11) else "Python 3.11+ required")'
          python3 candidate/scripts/pr-gates/plan.py inventory --root candidate --baseline-root trusted --expected-head "$EXPECTED_HEAD" --expected-base "$EXPECTED_BASE"
          echo "matrix=$(python3 candidate/scripts/pr-gates/plan.py matrix --root candidate --baseline-root trusted --expected-head "$EXPECTED_HEAD" --expected-base "$EXPECTED_BASE")" >> "$GITHUB_OUTPUT"

      - name: Derive every enabled integration target and feature row
        id: contracts
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          EXPECTED_BASE: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          set -euo pipefail
          echo "matrix=$(python3 candidate/scripts/pr-gates/contracts.py matrix --root candidate --baseline-root trusted --expected-head "$EXPECTED_HEAD" --expected-base "$EXPECTED_BASE")" >> "$GITHUB_OUTPUT"

  workspace-format:
    name: candidate workspace format
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable
          components: rustfmt
      - name: Check complete workspace formatting
        run: cargo fmt --all -- --check

  workspace-unit-static:
    name: candidate unit-static (${{ matrix.package }}, ${{ matrix.profile }})
    if: github.event_name == 'pull_request'
    needs: unit-plan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.unit-plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: candidate -> target
          shared-key: pr-unit-static-${{ matrix.package }}
          cache-on-failure: true
          cache-workspace-crates: false
      - name: Install generated Python client test dependency
        if: matrix.package == 'openapi-codegen'
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/pr-gates-python"
          "$RUNNER_TEMP/pr-gates-python/bin/python" -m pip install 'pydantic>=2,<3'
          "$RUNNER_TEMP/pr-gates-python/bin/python" -m pip freeze
          "$RUNNER_TEMP/pr-gates-python/bin/python" -c 'import pydantic; assert pydantic.__version__.split(".")[0] == "2"'
          echo "$RUNNER_TEMP/pr-gates-python/bin" >> "$GITHUB_PATH"
      - name: Run every enabled package unit target and retain nonzero evidence
        env:
          PACKAGE: ${{ matrix.package }}
          PROFILE: ${{ matrix.profile }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          EXPECTED_BASE: ${{ github.event.pull_request.base.sha }}
          CARGO_INCREMENTAL: "0"
        run: python3 candidate/scripts/pr-gates/plan.py run --root candidate --baseline-root trusted --expected-head "$EXPECTED_HEAD" --expected-base "$EXPECTED_BASE" --package "$PACKAGE" --profile "$PROFILE" --kind unit
      - name: Check package all-target clippy
        if: ${{ !cancelled() }}
        env:
          PACKAGE: ${{ matrix.package }}
          PROFILE: ${{ matrix.profile }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          EXPECTED_BASE: ${{ github.event.pull_request.base.sha }}
          CARGO_INCREMENTAL: "0"
        run: python3 candidate/scripts/pr-gates/plan.py run --root candidate --baseline-root trusted --expected-head "$EXPECTED_HEAD" --expected-base "$EXPECTED_BASE" --package "$PACKAGE" --profile "$PROFILE" --kind clippy

      - name: Build documentation and execute every collected example
        if: ${{ !cancelled() }}
        env:
          PACKAGE: ${{ matrix.package }}
          PROFILE: ${{ matrix.profile }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          EXPECTED_BASE: ${{ github.event.pull_request.base.sha }}
          CARGO_INCREMENTAL: "0"
        run: python3 candidate/scripts/pr-gates/docs.py --root candidate --baseline-root trusted --expected-head "$EXPECTED_HEAD" --expected-base "$EXPECTED_BASE" --package "$PACKAGE" --profile "$PROFILE"

  # Keep push and manual crate checks working when PR-only unit jobs are
  # skipped. On PRs, every prerequisite must succeed before integration.
  unit-stage:
    name: candidate unit/static complete
    if: ${{ always() && !cancelled() }}
    needs: [unit-plan, workspace-format, workspace-unit-static, source-issue-47-unit]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify the complete unit/static stage
        env:
          EVENT_NAME: ${{ github.event_name }}
          INVENTORY: ${{ needs.unit-plan.result }}
          FORMATTING: ${{ needs.workspace-format.result }}
          UNIT_STATIC: ${{ needs.workspace-unit-static.result }}
          ISSUE_47_UNIT: ${{ needs.source-issue-47-unit.result }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" != pull_request ]]; then exit 0; fi
          [[ "$INVENTORY" == success && "$FORMATTING" == success && "$UNIT_STATIC" == success && "$ISSUE_47_UNIT" == success ]]

  workspace-contracts:
    name: candidate contracts (${{ matrix.package }}, ${{ matrix.profile }})
    if: github.event_name == 'pull_request'
    needs: [unit-plan, unit-stage]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.unit-plan.outputs.contracts) }}
    env:
      CARGO_INCREMENTAL: "0"
      SERVICE_K8S_LIVE_KUBE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: candidate -> target
          shared-key: pr-contracts-${{ matrix.package }}
          cache-on-failure: true
          cache-workspace-crates: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        if: matrix.package == 'openapi-codegen'
      - name: Require external compiler and runtime tools
        if: matrix.package == 'openapi-codegen'
        shell: bash
        run: |
          set -euo pipefail
          node --version
          npm --version
          uv --version
          python3 -m venv "$RUNNER_TEMP/pr-contracts-python"
          "$RUNNER_TEMP/pr-contracts-python/bin/python" -m pip install 'pydantic>=2,<3'
          "$RUNNER_TEMP/pr-contracts-python/bin/python" -m pip freeze
          echo "$RUNNER_TEMP/pr-contracts-python/bin" >> "$GITHUB_PATH"
          cp -R candidate/scripts/pr-gates/generated-rust-dependencies "$RUNNER_TEMP/generated-rust-dependencies"
          cargo fetch --manifest-path "$RUNNER_TEMP/generated-rust-dependencies/Cargo.toml"
          sha256sum "$RUNNER_TEMP/generated-rust-dependencies/Cargo.lock"
      - name: Create disposable Kind cluster for live certificate assertions
        if: matrix.package == 'service-k8s'
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error -o "$RUNNER_TEMP/kind" https://github.com/kubernetes-sigs/kind/releases/download/v0.29.0/kind-linux-amd64
          echo "c72eda46430f065fb45c5f70e7c957cc9209402ef309294821978677c8fb3284  $RUNNER_TEMP/kind" | sha256sum --check --strict
          chmod +x "$RUNNER_TEMP/kind"
          "$RUNNER_TEMP/kind" create cluster --name core-contracts --wait 120s
          kubectl config current-context
          test "$(kubectl config current-context)" = kind-core-contracts
          kubectl get nodes
      - name: Supply the current workspace root to legacy EC contract probes
        run: mkdir -p candidate/.aw
      - name: Run complete release integration targets including ignored cases
        env:
          PACKAGE: ${{ matrix.package }}
          PROFILE: ${{ matrix.profile }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          EXPECTED_BASE: ${{ github.event.pull_request.base.sha }}
        run: python3 candidate/scripts/pr-gates/contracts.py run --root candidate --baseline-root trusted --expected-head "$EXPECTED_HEAD" --expected-base "$EXPECTED_BASE" --package "$PACKAGE" --profile "$PROFILE"
      - name: Remove disposable Kind cluster
        if: ${{ always() && matrix.package == 'service-k8s' }}
        run: '"$RUNNER_TEMP/kind" delete cluster --name core-contracts'

  measured-performance:
    name: candidate measured performance
    if: github.event_name == 'pull_request'
    needs: [unit-stage, crate-gates, source-issue-47-integration, workspace-contracts]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: candidate -> target
          shared-key: pr-measured-performance
          cache-on-failure: true
          cache-workspace-crates: false
      - name: Install generated Python client runtime dependency
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/pr-measure-python"
          "$RUNNER_TEMP/pr-measure-python/bin/python" -m pip install 'pydantic>=2,<3'
          "$RUNNER_TEMP/pr-measure-python/bin/python" -m pip freeze
          echo "$RUNNER_TEMP/pr-measure-python/bin" >> "$GITHUB_PATH"
      - name: Retain measured workloads and original thresholds
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          EXPECTED_BASE: ${{ github.event.pull_request.base.sha }}
        run: python3 candidate/scripts/pr-gates/measure.py --root candidate --baseline-root trusted --expected-head "$EXPECTED_HEAD" --expected-base "$EXPECTED_BASE"
