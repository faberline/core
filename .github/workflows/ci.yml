name: core ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      ref:
        description: Commit, tag, or branch to test.
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: core-ci-${{ github.ref }}-${{ inputs.ref }}
  cancel-in-progress: true

jobs:
  crate-gates:
    name: ${{ matrix.crate }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - crate: service-k8s
            args: -p service-k8s
          - crate: storage-durable
            args: -p storage-durable
          - crate: service-backup
            args: -p service-backup --features http-client
          - crate: raft-core
            args: -p raft-core
          - crate: raft-runtime
            args: -p raft-runtime
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: Run crate tests
        env:
          CARGO_INCREMENTAL: "0"
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked ${{ matrix.args }}


  # Ordinary read-only PR tests execute candidate code, as the legacy crate
  # jobs do. They do not approve trusted qualification. That independent
  # policy, immutable identity review and failure-only boundary are unchanged.
  unit-plan:
    name: candidate workspace unit inventory
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable
      - name: Check nonempty PR gate fixtures
        working-directory: candidate
        run: |
          python3 -c 'import sys,unittest; suite=unittest.defaultTestLoader.discover("scripts/pr-gates/tests"); count=suite.countTestCases(); print("fixture_count="+str(count)); sys.exit(0 if count > 0 and unittest.TextTestRunner(verbosity=2).run(suite).wasSuccessful() else 1)'
      - name: Derive complete current-head matrix and baseline inventory
        id: plan
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          EXPECTED_BASE: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -c 'import sys; sys.exit(0 if sys.version_info >= (3, 11) else "Python 3.11+ required")'
          python3 candidate/scripts/pr-gates/plan.py inventory --root candidate --baseline-root trusted --expected-head "$EXPECTED_HEAD" --expected-base "$EXPECTED_BASE"
          echo "matrix=$(python3 candidate/scripts/pr-gates/plan.py matrix --root candidate --baseline-root trusted --expected-head "$EXPECTED_HEAD" --expected-base "$EXPECTED_BASE")" >> "$GITHUB_OUTPUT"

  workspace-format:
    name: candidate workspace format
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable
          components: rustfmt
      - name: Check complete workspace formatting
        run: cargo fmt --all -- --check

  workspace-unit-static:
    name: candidate unit-static (${{ matrix.package }}, ${{ matrix.profile }})
    if: github.event_name == 'pull_request'
    needs: unit-plan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.unit-plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable
          components: clippy
      - name: Run every enabled package unit target and retain nonzero evidence
        env:
          PACKAGE: ${{ matrix.package }}
          PROFILE: ${{ matrix.profile }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          EXPECTED_BASE: ${{ github.event.pull_request.base.sha }}
          CARGO_INCREMENTAL: "0"
        run: python3 candidate/scripts/pr-gates/plan.py run --root candidate --baseline-root trusted --expected-head "$EXPECTED_HEAD" --expected-base "$EXPECTED_BASE" --package "$PACKAGE" --profile "$PROFILE" --kind unit
      - name: Check package all-target clippy
        if: ${{ !cancelled() }}
        env:
          PACKAGE: ${{ matrix.package }}
          PROFILE: ${{ matrix.profile }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          EXPECTED_BASE: ${{ github.event.pull_request.base.sha }}
          CARGO_INCREMENTAL: "0"
        run: python3 candidate/scripts/pr-gates/plan.py run --root candidate --baseline-root trusted --expected-head "$EXPECTED_HEAD" --expected-base "$EXPECTED_BASE" --package "$PACKAGE" --profile "$PROFILE" --kind clippy
