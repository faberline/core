name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_INCREMENTAL: "0"

jobs:
  lint:
    name: "lint: fmt and clippy"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check ci.yml shape
        run: bash ci/check-ci-shape.sh
      - name: Test ci.yml shape check
        run: bash ci/test-check-ci-shape.sh
      - name: Check the toolchain pin
        run: bash ci/check-toolchain-pin.sh
      - name: Test the toolchain pin check
        run: bash ci/test-check-toolchain-pin.sh
      - name: Check release.yml shape
        run: |
          bash ci/check-release-shape.sh
          bash ci/test-check-release-shape.sh
      - name: Check feature rows
        run: bash ci/test-feature-rows.sh
      - name: Test the kind rows runner
        run: bash ci/test-run-kind-rows.sh
      - name: Check release policy
        run: |
          python3 ci/check-release-policy.py
          python3 -m unittest ci/test_check_release_policy.py
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          shared-key: ci-lint
          cache-on-failure: true
          cache-workspace-crates: false
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test-workspace:
    name: "test: workspace"
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Supply the workspace root to legacy EC contract probes
        run: mkdir -p .aw
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.99.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          shared-key: ci-test-workspace
          cache-on-failure: true
          cache-workspace-crates: false
      - run: cargo test --workspace --locked --exclude service-k8s --exclude openapi-codegen --exclude service-backup -- --include-ignored

  test-service-backup:
    name: "test: service-backup"
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Supply the workspace root to legacy EC contract probes
        run: mkdir -p .aw
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.99.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          shared-key: ci-test-service-backup
          cache-on-failure: true
          cache-workspace-crates: false
      - run: cargo test --locked -p service-backup --features http-client -- --include-ignored

  test-service-k8s:
    name: "test: service-k8s"
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Supply the workspace root to legacy EC contract probes
        run: mkdir -p .aw
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.99.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          shared-key: ci-test-service-k8s
          cache-on-failure: true
          cache-workspace-crates: false
      - run: cargo test --locked -p service-k8s

  test-openapi-codegen:
    name: "test: openapi-codegen"
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Supply the workspace root to legacy EC contract probes
        run: mkdir -p .aw
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.99.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          shared-key: ci-test-openapi-codegen
          cache-on-failure: true
          cache-workspace-crates: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
      - name: Require external compiler and runtime tools
        shell: bash
        run: |
          set -euo pipefail
          node --version
          npm --version
          uv --version
          python3 -m venv "$RUNNER_TEMP/ci-python"
          "$RUNNER_TEMP/ci-python/bin/python" -m pip install 'pydantic>=2,<3'
          "$RUNNER_TEMP/ci-python/bin/python" -m pip freeze
          echo "$RUNNER_TEMP/ci-python/bin" >> "$GITHUB_PATH"
          cp -R ci/generated-rust-dependencies "$RUNNER_TEMP/generated-rust-dependencies"
          cargo fetch --locked --manifest-path "$RUNNER_TEMP/generated-rust-dependencies/Cargo.toml"
          sha256sum "$RUNNER_TEMP/generated-rust-dependencies/Cargo.lock"
      - run: cargo test --locked -p openapi-codegen -- --include-ignored

  test-feature-rows:
    name: "test: feature rows (${{ matrix.package }})"
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        include:
          - { package: index-text }
          - { package: service-auth }
          - { package: service-backup }
          - { package: service-http }
          - { package: service-observability }
          - { package: storage-object }
          - { package: transport-h2c }
          - { package: ui-runtime }
          - { package: cli-std }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Supply the workspace root to legacy EC contract probes
        run: mkdir -p .aw
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.99.1
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          shared-key: ci-test-feature-rows
          cache-on-failure: true
          cache-workspace-crates: false
      - name: Run all feature rows of ${{ matrix.package }}
        run: bash ci/run-feature-rows.sh ${{ matrix.package }}

  e2e-service-k8s:
    name: "e2e: service-k8s kind (${{ matrix.group }})"
    needs: [test-workspace, test-service-backup, test-service-k8s, test-openapi-codegen, test-feature-rows]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SERVICE_K8S_LIVE_KUBE: "1"
    strategy:
      fail-fast: false
      matrix:
        include:
          - { group: group-a, profiles: "default all-features no-default" }
          - { group: group-b, profiles: "feature:certificate feature:controller feature:full" }
          - { group: group-c, profiles: "feature:gcp-cas feature:gcp-cas-client feature:render-only" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Supply the workspace root to legacy EC contract probes
        run: mkdir -p .aw
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.99.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          shared-key: ci-e2e-service-k8s
          cache-on-failure: true
          cache-workspace-crates: false
      - name: Create disposable kind cluster
        uses: faberline/aw/.github/actions/kind@5a04bb391f9c6df1df7b34a532874a86d783801d
        with:
          name: core-contracts
      - name: Verify the disposable kind context
        shell: bash
        run: |
          set -euo pipefail
          kubectl config current-context
          test "$(kubectl config current-context)" = kind-core-contracts
          kubectl get nodes
      - name: Run the kind rows of ${{ matrix.group }}
        run: bash ci/run-kind-rows.sh ${{ matrix.profiles }}
      - name: Remove disposable kind cluster
        if: always()
        shell: bash
        run: 'kind delete cluster --name core-contracts'

  gate:
    name: gate
    if: always()
    needs: [lint, test-workspace, test-service-backup, test-service-k8s, test-openapi-codegen, test-feature-rows, e2e-service-k8s]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # The guideline (docs/standards/ci.md) accepts a skipped stage; the spec does not.
      # The first step is the guideline check. The second step keeps the spec rule:
      # a skipped stage fails the gate too.
      - name: Check every stage
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$RESULTS" | jq -e '.lint.result == "success"' > /dev/null
          echo "$RESULTS" | jq -e 'all(.[]; .result == "success" or .result == "skipped")' > /dev/null
      - name: Require every stage to succeed, a skipped stage included
        run: test "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}" = "false"
