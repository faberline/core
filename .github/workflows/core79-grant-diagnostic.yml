name: Read-only Core grant review diagnostic
on:
  push:
    branches: [codex/core79-grant-diagnostic]
    paths: [.github/workflows/core79-grant-diagnostic.yml]
permissions:
  actions: read
  contents: read
  pull-requests: read
  issues: read
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: faberline/aw
          ref: 8e2e93e5ba8feb30b6668de39139980ea3bb085c
          path: trusted-aw
          persist-credentials: false
      - name: Prepare hash-locked metadata parser without credentials
        id: runtime
        env:
          GH_TOKEN: ''
          CLAUDE_CODE_OAUTH_TOKEN: ''
          GITHUB_TOKEN: ''
          ANTHROPIC_API_KEY: ''
        run: |
          set -euo pipefail
          runtime="$(mktemp -d "$RUNNER_TEMP/diagnostic-python-XXXXXX")"
          python3 -I -m venv "$runtime"
          "$runtime/bin/python" -I -m pip --isolated install --disable-pip-version-check --no-input --no-deps --only-binary=:all: --require-hashes --index-url https://pypi.org/simple -r trusted-aw/plugins/faberline/skills/issue-ci/scripts/readiness-requirements.txt
          echo "python=$runtime/bin/python" >> "$GITHUB_OUTPUT"
      - name: Verify fixed signed Claude without credentials
        id: provision
        env:
          GH_TOKEN: ''
          CLAUDE_CODE_OAUTH_TOKEN: ''
          GITHUB_TOKEN: ''
          ANTHROPIC_API_KEY: ''
        run: python3 -I -B trusted-aw/plugins/faberline/skills/issue-ci/scripts/policy_adoption_provision.py
      - name: Install verified binary
        env:
          VERIFIED_BINARY: ${{ steps.provision.outputs.binary }}
        run: sudo install -m 0755 -- "$VERIFIED_BINARY" /usr/local/bin/claude
      - name: Diagnose independently without lifecycle writes
        env:
          GH_TOKEN: ${{ github.token }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          REVIEW_PYTHON: ${{ steps.runtime.outputs.python }}
        run: |
          "$REVIEW_PYTHON" -I -B - <<'PY'
          import importlib.util, json, os
          from pathlib import Path
          path=Path('trusted-aw/plugins/faberline/skills/issue-ci/scripts/policy_adoption_grant_review.py')
          spec=importlib.util.spec_from_file_location('diagnostic_review',path)
          mod=importlib.util.module_from_spec(spec);spec.loader.exec_module(mod)
          repo='faberline/core';pr=124;head='d8de40bce14885f5569edb0e9e2fde3fc304c016';evaluator='8e2e93e5ba8feb30b6668de39139980ea3bb085c'
          before=mod.proposal(mod.a.ci,repo,pr,head,evaluator)
          result=mod.invoke(before,os.environ['CLAUDE_CODE_OAUTH_TOKEN'])
          after=mod.proposal(mod.a.ci,repo,pr,head,evaluator)
          assert before==after, 'diagnostic_inputs_changed'
          print('DIAGNOSTIC_ONLY_NOT_FORMAL_REVIEW '+json.dumps({'repo':repo,'pr':pr,'head':head,'result':result},ensure_ascii=True,separators=(',',':')))
          PY
