name: Core Raft election diagnostic
on:
  push:
    branches: [codex/raft-election-diagnostics]
    paths: [.github/workflows/raft-election-diagnostics.yml]
permissions:
  contents: read
jobs:
  election:
    name: Full Raft integration target (${{ matrix.scheduling }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        scheduling: [default, two-threads]
    steps:
      - name: Check out the exact failed PR head without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: f3491c045df3be883dac7e2dda0198d8cb59c944
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable
      - name: Record runner and immutable source identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = f3491c045df3be883dac7e2dda0198d8cb59c944
          git rev-parse HEAD
          nproc
          if test -r /sys/fs/cgroup/cpu.max; then cat /sys/fs/cgroup/cpu.max; fi
          rustc --version
      - name: Run the full integration target twice with unchanged assertions
        shell: bash
        env:
          SCHEDULING: ${{ matrix.scheduling }}
          RUST_BACKTRACE: '1'
          CARGO_INCREMENTAL: '0'
        run: |
          set -uo pipefail
          failed=0
          for attempt in 1 2; do
            echo "Full target attempt $attempt; scheduling=$SCHEDULING"
            if [[ "$SCHEDULING" == 'default' ]]; then
              cargo test --locked -p raft-runtime --test it || failed=1
            elif [[ "$SCHEDULING" == 'two-threads' ]]; then
              cargo test --locked -p raft-runtime --test it -- --test-threads=2 || failed=1
            else
              exit 2
            fi
          done
          exit "$failed"
