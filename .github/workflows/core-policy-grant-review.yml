name: Reviewed policy grant
on:
  push:
    branches: [codex/core79-grant-review]
    paths: [.github/workflows/core-policy-grant-review.yml]
permissions: {}
jobs:
  grant-review:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    permissions: {actions: read, contents: read, pull-requests: read, issues: read}
    steps:
      - uses: faberline/aw/.github/actions/policy-adoption-grant-review@8e2e93e5ba8feb30b6668de39139980ea3bb085c
        with:
          grant-pr: '124'
          grant-head: 'd8de40bce14885f5569edb0e9e2fde3fc304c016'
          claude-token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
