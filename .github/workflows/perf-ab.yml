# Manual A/B of the perf workloads (core#467). Never runs on a change; reports only.
name: perf-ab

on:
  workflow_dispatch:
    inputs:
      base_ref:
        description: "Base ref, measured first in each pair"
        required: false
        type: string
        default: v0.5.0
      head_ref:
        description: "Head ref, measured second in each pair"
        required: false
        type: string
        default: eea0dc4a389d30112b06feb386d559789bca0584
      repeats:
        description: "Runs per workload and ref"
        required: false
        type: string
        default: "5"

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: "0"

jobs:
  perf-ab:
    name: "perf: A/B"
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.head_ref }}
          path: head
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.base_ref }}
          path: base
          persist-credentials: false
      - name: Overlay the measured test files of the head ref onto the base tree
        shell: bash
        run: |
          set -euo pipefail
          cp head/crates/openapi-codegen/src/domain/emit/py/tests/h2c_connection.rs base/crates/openapi-codegen/src/domain/emit/py/tests/h2c_connection.rs
          cp head/crates/raft-runtime/tests/write_path_latency.rs base/crates/raft-runtime/tests/write_path_latency.rs
          mkdir -p head/.aw base/.aw
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.99.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
      - name: Require external compiler and runtime tools
        shell: bash
        run: |
          set -euo pipefail
          node --version
          npm --version
          uv --version
          python3 -m venv "$RUNNER_TEMP/ci-python"
          "$RUNNER_TEMP/ci-python/bin/python" -m pip install 'pydantic>=2,<3'
          echo "$RUNNER_TEMP/ci-python/bin" >> "$GITHUB_PATH"
          cp -R head/ci/generated-rust-dependencies "$RUNNER_TEMP/generated-rust-dependencies"
          cargo fetch --locked --manifest-path "$RUNNER_TEMP/generated-rust-dependencies/Cargo.toml"
      - name: Build, measure and report
        shell: bash
        env:
          BASE_REF: ${{ inputs.base_ref }}
          HEAD_REF: ${{ inputs.head_ref }}
          REPEATS: ${{ inputs.repeats }}
        run: |
          python3 - <<'PY'
          import importlib.util
          import json
          import os
          import pathlib
          import subprocess
          import sys

          spec = importlib.util.spec_from_file_location('measure_performance', 'head/ci/measure-performance.py')
          mp = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mp)

          repeats = int(os.environ['REPEATS'])
          if repeats < 1:
              print('repeats must be at least 1')
              sys.exit(1)

          refs = [('base', os.environ['BASE_REF'], 'base'), ('head', os.environ['HEAD_REF'], 'head')]
          kinds = list(mp.COMPARED)

          # Build phase: one build per ref and workload, on this one machine.
          for label, ref, directory in refs:
              for kind in kinds:
                  cmd = list(mp.COMMANDS[kind])
                  cmd.insert(cmd.index('--'), '--no-run')
                  print(f'build {label} {kind}: {" ".join(cmd)}', flush=True)
                  subprocess.run(cmd, cwd=directory, check=True)

          # Measure phase: base then head for each repeat, so both see the same drift.
          samples = {label: {kind: [] for kind in kinds} for label, _, _ in refs}
          errors = []
          for i in range(repeats):
              for kind in kinds:
                  for label, _, directory in refs:
                      try:
                          result = mp.run_workload(kind, directory)
                      except ValueError as error:
                          errors.append(f'{label} {kind} run {i + 1}: {error}')
                          continue
                      value = result['measurement']['latency'] if kind == 'http2' else result['measurement']
                      samples[label][kind].append(value)

          medians = {
              label: {kind: (mp.median_latency(samples[label][kind]) if samples[label][kind] else None) for kind in kinds}
              for label, _, _ in refs
          }
          baseline = mp.load_baseline('head/ci/performance-baseline.json')

          def head_sha(directory):
              out = subprocess.run(['git', '-C', directory, 'rev-parse', 'HEAD'], capture_output=True, text=True, check=True)
              return out.stdout.strip()

          report_dir = pathlib.Path('perf-ab-report')
          report_dir.mkdir(exist_ok=True)
          report = {
              'base_ref': refs[0][1],
              'head_ref': refs[1][1],
              'base_sha': head_sha('base'),
              'head_sha': head_sha('head'),
              'repeats': repeats,
              'runner_image': os.environ.get('ImageVersion'),
              'run_id': os.environ.get('GITHUB_RUN_ID'),
              'samples': samples,
              'medians': medians,
              'baseline': {kind: baseline[kind] for kind in kinds},
              'errors': errors,
          }
          (report_dir / 'perf-ab.json').write_text(json.dumps(report, indent=2) + '\n')

          lines = [
              '## perf-ab (core#467)',
              '',
              f'Base `{refs[0][1]}` at `{report["base_sha"]}`, head `{refs[1][1]}` at `{report["head_sha"]}`, {repeats} runs each, alternating. Report only: no limit is applied.',
              '',
          ]
          for kind in kinds:
              lines += [f'### {kind}', '', '| ref | p50_ms runs | p50_ms median | p99_ms median | requests_per_second median |', '|---|---|---|---|---|']
              for label, _, _ in refs:
                  values = samples[label][kind]
                  med = medians[label][kind]
                  runs = ', '.join(str(v['p50_ms']) for v in values) or 'none'
                  if med is None:
                      lines.append(f'| {label} | {runs} | - | - | - |')
                  else:
                      lines.append(f'| {label} | {runs} | {med["p50_ms"]} | {med["p99_ms"]} | {med["requests_per_second"]} |')
              b = baseline[kind]
              lines.append(f'| baseline | - | {b["p50_ms"]} | {b["p99_ms"]} | {b["requests_per_second"]} |')
              base_med, head_med = medians['base'][kind], medians['head'][kind]
              if base_med and head_med:
                  lines.append('')
                  lines.append(f'median p50 head / base: {round(head_med["p50_ms"] / base_med["p50_ms"], 3)}')
              lines.append('')
          if errors:
              lines += ['### errors', ''] + [f'- {e}' for e in errors] + ['']
          markdown = '\n'.join(lines) + '\n'
          (report_dir / 'perf-ab.md').write_text(markdown)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write(markdown)
          print(markdown)

          # Exit non-zero only when nothing was measured for a pair. Never compare with a limit.
          missing = [f'{label} {kind}' for label, _, _ in refs for kind in kinds if not samples[label][kind]]
          if missing:
              print('no sample for: ' + ', '.join(missing))
              sys.exit(1)
          PY
      - name: Upload the A/B report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: perf-ab
          path: perf-ab-report/
          if-no-files-found: error
        if: always()
