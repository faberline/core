# Manual A/B of the perf workloads (core#467). Never runs on a change; reports only.
name: perf-ab

on:
  workflow_dispatch:
    inputs:
      base_ref:
        description: "Base ref, measured first in each pair"
        required: false
        type: string
        default: v0.5.0
      head_ref:
        description: "Head ref, measured second in each pair"
        required: false
        type: string
        default: eea0dc4a389d30112b06feb386d559789bca0584
      repeats:
        description: "Runs per workload and ref"
        required: false
        type: string
        default: "5"

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: "0"

jobs:
  perf-ab:
    name: "perf: A/B"
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.head_ref }}
          path: head
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.base_ref }}
          path: base
          persist-credentials: false
      - name: Overlay the measured test files of the head ref onto the base tree
        shell: bash
        run: |
          set -euo pipefail
          cp head/crates/openapi-codegen/src/domain/emit/py/tests/h2c_connection.rs base/crates/openapi-codegen/src/domain/emit/py/tests/h2c_connection.rs
          cp head/crates/raft-runtime/tests/write_path_latency.rs base/crates/raft-runtime/tests/write_path_latency.rs
          mkdir -p head/.aw base/.aw
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.99.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
      - name: Require external compiler and runtime tools
        shell: bash
        run: |
          set -euo pipefail
          node --version
          npm --version
          uv --version
          python3 -m venv "$RUNNER_TEMP/ci-python"
          "$RUNNER_TEMP/ci-python/bin/python" -m pip install 'pydantic>=2,<3'
          echo "$RUNNER_TEMP/ci-python/bin" >> "$GITHUB_PATH"
          cp -R head/ci/generated-rust-dependencies "$RUNNER_TEMP/generated-rust-dependencies"
          cargo fetch --locked --manifest-path "$RUNNER_TEMP/generated-rust-dependencies/Cargo.toml"
      - name: Build, measure and report
        shell: bash
        env:
          BASE_REF: ${{ inputs.base_ref }}
          HEAD_REF: ${{ inputs.head_ref }}
          REPEATS: ${{ inputs.repeats }}
        run: |
          set -euo pipefail
          python3 head/ci/measure-performance.py --root head --base-root base --base-ref "$BASE_REF" --head-ref "$HEAD_REF" --repeats "$REPEATS" --report-dir perf-ab-report --report-only
      - name: Upload the A/B report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: perf-ab
          path: perf-ab-report/
          if-no-files-found: error
        if: always()
