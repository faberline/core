# Manual run of the core drills on the shared GKE test cluster (core#379).
# Never on pull_request or push: a run starts Spot nodes.
name: gke-drill
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gke-drill:
    permissions:
      id-token: write
      contents: read
      packages: read
    uses: faberline/aw/.github/workflows/gke-test.yml@f632d2715f8ef55caf48a3243ab1d72505ac1318
    with:
      image: registry.k8s.io/pause:3.10
      aw-ref: f632d2715f8ef55caf48a3243ab1d72505ac1318
      ttl-minutes: 45
      queue-minutes: 30
      test-command: bash ci/run-gke-drill.sh
