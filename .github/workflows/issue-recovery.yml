name: Verified issue recovery
on:
  repository_dispatch:
    types: [aw-verified-merge-recover]
  workflow_run:
    workflows: [Issue CI and Claude outcome]
    types: [completed]
    branches: [main]
permissions: {}
concurrency:
  group: issue-ci-handoff
  cancel-in-progress: false
jobs:
  recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: write
      issues: write
      pull-requests: read
      statuses: write
    steps:
      - uses: faberline/aw/.github/actions/verified-issue-recovery@8eba33a85152d7056a8b75a5998684f66e0bd8d5
