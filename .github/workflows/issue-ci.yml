# Use the consumer's real test workflow names and an immutable reviewed AW ref.
# Bind this actual workflow ID, Git blob and report job in development_reporter.
name: Development CI label handoff
on:
  push:
    branches: [main]
  repository_dispatch:
    types: [aw-development-reconcile]
  workflow_run:
    workflows: ["Core development CI"]
    types: [requested, in_progress, completed]
  issues:
    types: [edited, reopened, closed, labeled, unlabeled]
permissions: {}
concurrency:
  group: issue-ci-handoff
  cancel-in-progress: false
jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      pull-requests: read
      issues: write
    steps:
      - uses: faberline/aw/.github/actions/issue-ci@94c33a871afed538f0f4a12c49825abb0b442978
        with:
          operation: development-report
