name: Reviewed policy adoption
on:
  push:
    branches: [codex/core-policy-publisher]
    paths: [.github/workflows/core-policy-publisher.yml]
permissions: {}
concurrency: {group: issue-ci-handoff, cancel-in-progress: false}
jobs:
  adopt:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions: {actions: read, contents: write, pull-requests: write, statuses: write, issues: read}
    steps:
      - uses: faberline/aw/.github/actions/policy-adoption@ae15be60678d27c407c1873866892505bb089e17
