name: Independent Claude issue contract v2 review
on:
  push:
    branches: [codex/issue-contract-v2-review]
    paths: [.github/workflows/claude-wiring-review.yml, scripts/claude-wiring-review/**]
permissions:
  contents: read
  actions: read
  pull-requests: read
  issues: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Provision fixed signed official Claude without credentials
        id: provision
        run: python3 -I scripts/claude-wiring-review/provision-claude.py
      - name: Install verified binary
        env:
          VERIFIED_BINARY: ${{ steps.provision.outputs.binary }}
        run: sudo install -m 0755 -- "$VERIFIED_BINARY" /usr/local/bin/claude
      - name: Read public shared source at the exact candidate commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: faberline/aw
          ref: 3fab6ab7ee81e6f12c47a6a65e283ec74b8114fd
          path: scripts/claude-wiring-review/source
          fetch-depth: 0
          persist-credentials: false
      - name: Review shared diff and issue contract without executing source
        env:
          GH_TOKEN: ${{ github.token }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          REVIEW_REPO: faberline/aw
          REVIEW_PR: '96'
          REVIEW_ISSUE: '95'
          REVIEW_HEAD: 3fab6ab7ee81e6f12c47a6a65e283ec74b8114fd
          REVIEW_BASE: 093c6a693f7577283898fd2d27ab61169f1950c6
        run: python3 -I scripts/claude-wiring-review/runner.py
      - name: Keep review evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: claude-issue-contract-v2-3fab6ab
          path: scripts/claude-wiring-review/evidence/
          if-no-files-found: warn
