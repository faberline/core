name: Independent Claude review grant nonpass evidence
on:
  push:
    branches: [codex/aw125-negative-review]
    paths: [.github/workflows/claude-wiring-review.yml, scripts/claude-wiring-review/**]
permissions:
  contents: read
  actions: read
  pull-requests: read
  issues: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Provision fixed signed official Claude without credentials
        id: provision
        run: python3 -I scripts/claude-wiring-review/provision-claude.py
      - name: Install verified binary
        env:
          VERIFIED_BINARY: ${{ steps.provision.outputs.binary }}
        run: sudo install -m 0755 -- "$VERIFIED_BINARY" /usr/local/bin/claude
      - name: Review exact nonpass evidence and issue without executing target source
        env:
          GH_TOKEN: ${{ github.token }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          REVIEW_REPO: faberline/aw
          REVIEW_PR: '126'
          REVIEW_ISSUE: '125'
          REVIEW_HEAD: 0bf3b6c9ae465a149979370ebc609711e53f5f1b
          REVIEW_BASE: 3a0b108bf2dd22c289c51876f4ce2197c038663e
        run: python3 -I scripts/claude-wiring-review/runner.py
      - name: Keep review evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: claude-aw125-nonpass-0bf3b6c
          path: scripts/claude-wiring-review/evidence/
          if-no-files-found: warn
