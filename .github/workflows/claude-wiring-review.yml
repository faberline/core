name: Independent Claude review log fix review
on:
  push:
    branches: [codex/review-log-metadata-review]
    paths: [.github/workflows/claude-wiring-review.yml, scripts/claude-wiring-review/**]
permissions:
  contents: read
  actions: read
  pull-requests: read
  issues: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Provision fixed signed official Claude without credentials
        id: provision
        run: python3 -I scripts/claude-wiring-review/provision-claude.py
      - name: Install verified binary
        env:
          VERIFIED_BINARY: ${{ steps.provision.outputs.binary }}
        run: sudo install -m 0755 -- "$VERIFIED_BINARY" /usr/local/bin/claude
      - name: Review shared diff and issue contract without executing source
        env:
          GH_TOKEN: ${{ github.token }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          REVIEW_REPO: faberline/aw
          REVIEW_PR: '102'
          REVIEW_ISSUE: '101'
          REVIEW_HEAD: c6193807870db65afa2cb9c26fd08fd73fc3c758
          REVIEW_BASE: fa05d50695ed39636cae9e46f7fe9cc6bd390907
        run: python3 -I scripts/claude-wiring-review/runner.py
      - name: Keep review evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: claude-review-log-metadata-c619380
          path: scripts/claude-wiring-review/evidence/
          if-no-files-found: warn
