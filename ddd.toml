[[exceptions]]
rule = "B2"
subject = "base64"
paths = ["crates/claim-token/src/domain/claim_token.rs"]
reason = "base64url is the token's wire encoding, fixed by the format keep and loom already exchange; the crate is a pure encoder with no I/O. Long-term."

[[exceptions]]
rule = "B2"
subject = "jieba_rs"
paths = ["crates/index-text/src/domain/tokenize.rs"]
reason = "The Jieba analyzer is a persisted schema choice (Analyzer::Jieba) and jieba-rs is its segmentation algorithm over an embedded dictionary, with no I/O; it sits behind the optional `jieba` feature. Long-term."

[[exceptions]]
rule = "B2"
subject = "utoipa"
paths = [
  "crates/service-projection/src/domain/checkpoint.rs",
  "crates/service-projection/src/domain/lag.rs",
  "crates/service-projection/src/domain/projection.rs",
]
reason = "utoipa::ToSchema is a compile-time description of the same serde wire shape. ProjectionDescriptor, ProjectionCheckpoint and ProjectionLag are served as-is in sift's OpenAPI document under these schema names, and a separate interfaces copy would duplicate the wire contract. The derive does no I/O. Long-term."

[[exceptions]]
rule = "B2"
subject = "schemars"
paths = [
  "crates/service-backup/src/domain/destination.rs",
  "crates/service-backup/src/domain/policy.rs",
]
reason = "Moved as-is in P1: BackupDestination, ScheduledBackupPolicy and RetentionPolicy derive schemars::JsonSchema because downstream CRDs embed them and their generated schemas must not change. P2: the schema derive moves to interfaces CRD body types, or stays as a documented long-term exception."

[[exceptions]]
rule = "B3"
subject = "infrastructure->application"
paths = [
  "crates/service-auth/src/infrastructure/google/http.rs",
  "crates/service-auth/src/infrastructure/k8s/kube_token_minter.rs",
]
reason = "Moved as-is in P1: HttpJwksSource, HttpAccessTokenIntrospection, KubeReviewBackend and KubeTokenMinter implement the #[async_trait] ports JwksSource, AccessTokenIntrospection, ReviewBackend and TokenMinter, which B2 keeps out of domain, together with their request and outcome types; KubeTokenMinter also reads the k8s SystemClock, and GoogleVerifier::google() in http.rs wires the HTTP sources and a ReloadableRoleMapVerifier into a GoogleVerifier. P2: the ports and their value types move to domain as native async-fn traits, SystemClock becomes an infrastructure adapter behind the domain Clock port, and google() moves to an assembly constructor."

[[exceptions]]
rule = "B2"
subject = "schemars"
paths = [
  "crates/service-k8s/src/domain/capacity.rs",
  "crates/service-k8s/src/domain/condition.rs",
  "crates/service-k8s/src/domain/lifecycle.rs",
]
reason = "schemars::JsonSchema is a compile-time description of the same serde wire shape. ReplicaLayerPolicy, ShardSplitPolicy, Condition, ProbeTiming and LifecyclePolicy are embedded as-is in downstream CRD specs and statuses (for example lumen crd.rs and tape crd.rs `Vec<service_k8s::Condition>`), whose generated schemas must not change, and a separate interfaces copy would duplicate the wire contract. The derive does no I/O. Long-term."

[[exceptions]]
rule = "B3"
subject = "application->infrastructure"
paths = [
  "crates/raft-runtime/src/application/host.rs",
  "crates/raft-runtime/src/application/host/propose.rs",
  "crates/raft-runtime/src/application/replica_host.rs",
]
reason = "Moved as-is in P1: RaftHost holds the concrete RaftStore and PeerTransport, propose forwards a PublishEnvelope to the leader, and ReplicaHostBuilder opens the RaftStore and builds the PeerTransport itself. P2: a raft log store port and a peer client port in application, implemented by infrastructure and injected at spawn."

[[exceptions]]
rule = "B3"
subject = "infrastructure->application"
paths = [
  "crates/raft-runtime/src/infrastructure/peer_rpc.rs",
  "crates/raft-runtime/src/infrastructure/store.rs",
  "crates/raft-runtime/src/infrastructure/topology_env.rs",
]
reason = "Moved as-is in P1: the outbound peer RPC client is an impl block on the host's Shared state and decodes RaftStatus, RaftStore names its files by GroupId and LEGACY_GROUP_ID, and the env reader builds ClusterDims and ClusterTopology and calls peer_ordinal. P2: GroupId, RaftStatus and the topology value types move to a domain layer both sides use, and the RPC client becomes a peer client adapter that owns its own state."

[[exceptions]]
rule = "B3"
subject = "interfaces->infrastructure"
paths = [
  "crates/raft-runtime/src/interfaces/conformance/deterministic_host.rs",
  "crates/raft-runtime/src/interfaces/peer_http/handlers.rs",
  "crates/raft-runtime/src/interfaces/peer_http/publish.rs",
  "crates/raft-runtime/src/interfaces/peer_http/registry.rs",
]
reason = "Moved as-is in P1: the peer HTTP handlers and the group registry decode the same wire envelopes the outbound RPC client sends, and DeterministicHost::open takes a RaftStore. P2: the envelope DTOs move to a wire module shared by the peer_http interface and the RPC adapter, and the conformance host takes the store port."

[[exceptions]]
rule = "B2"
subject = "serde_yaml"
paths = ["crates/compass/src/domain/spec/statemachine/mermaid_plus.rs"]
reason = "serde_yaml is a pure data-format codec like serde_json (on the allowlist): it formats or parses text in memory and does no I/O. MermaidPlusGenerator::generate_frontmatter calls serde_yaml::to_string to write the state machine's YAML frontmatter. Long-term."

[[exceptions]]
rule = "B2"
subject = "toml"
paths = ["crates/compass/src/domain/lint/toml_checker.rs"]
reason = "toml is a pure data-format codec like serde_json (on the allowlist): it formats or parses text in memory and does no I/O. TomlChecker::check_syntax parses the linted text as a toml::Value to report TM001 syntax errors. Long-term."

[[exceptions]]
rule = "B2"
subject = "tree_sitter"
paths = [
  "crates/compass/src/domain/lint/custom.rs",
  "crates/compass/src/domain/lint/go/function_rules.rs",
  "crates/compass/src/domain/lint/go/import_rules.rs",
  "crates/compass/src/domain/lint/html.rs",
  "crates/compass/src/domain/lint/python/import_rules.rs",
  "crates/compass/src/domain/lint/python/inspection_rules.rs",
  "crates/compass/src/domain/lint/python/pydantic_rules.rs",
  "crates/compass/src/domain/lint/terraform.rs",
  "crates/compass/src/domain/modules/import.rs",
  "crates/compass/src/domain/narrowing/condition_parser.rs",
  "crates/compass/src/domain/narrowing/match_pattern.rs",
  "crates/compass/src/domain/python_inference/inferencer.rs",
  "crates/compass/src/domain/python_inference/inferencer/classes.rs",
  "crates/compass/src/domain/python_inference/inferencer/compound.rs",
  "crates/compass/src/domain/python_inference/inferencer/expressions.rs",
  "crates/compass/src/domain/python_inference/inferencer/functions.rs",
  "crates/compass/src/domain/python_inference/inferencer/special_classes.rs",
  "crates/compass/src/domain/python_inference/inferencer/type_vars.rs",
  "crates/compass/src/domain/semantic/pdg/cfg/builder.rs",
  "crates/compass/src/domain/semantic/pdg/cfg/builder/branch.rs",
  "crates/compass/src/domain/semantic/pdg/cfg/builder/loops.rs",
  "crates/compass/src/domain/semantic/pdg/cfg/builder/try_except.rs",
  "crates/compass/src/domain/semantic/scope/analyzer.rs",
  "crates/compass/src/domain/semantic/scope/analyzer/visit.rs",
  "crates/compass/src/domain/semantic/symbols/css.rs",
  "crates/compass/src/domain/semantic/symbols/go.rs",
  "crates/compass/src/domain/semantic/symbols/go/type_decls.rs",
  "crates/compass/src/domain/semantic/symbols/html.rs",
  "crates/compass/src/domain/semantic/symbols/kubernetes.rs",
  "crates/compass/src/domain/semantic/symbols/python.rs",
  "crates/compass/src/domain/semantic/symbols/rust.rs",
  "crates/compass/src/domain/semantic/symbols/rust/type_defs.rs",
  "crates/compass/src/domain/semantic/symbols/terraform.rs",
  "crates/compass/src/domain/semantic/symbols/typescript.rs",
  "crates/compass/src/domain/semantic_model/builder.rs",
  "crates/compass/src/domain/semantic_model/builder/params.rs",
  "crates/compass/src/domain/semantic_model/builder/visit.rs",
  "crates/compass/src/domain/semantic_search/engine/call_graph.rs",
  "crates/compass/src/domain/semantic_search/engine/docstrings.rs",
  "crates/compass/src/domain/syntax/parsed_file.rs",
  "crates/compass/src/domain/type_checking/checker.rs",
  "crates/compass/src/domain/type_checking/checker/calls.rs",
  "crates/compass/src/domain/type_checking/checker/control_flow.rs",
  "crates/compass/src/domain/type_checking/checker/declarations.rs",
  "crates/compass/src/domain/type_checking/checker/statements.rs",
  "crates/compass/src/domain/type_checking/checker/variance.rs",
  "crates/compass/src/domain/type_refactoring/engine/ast_cache.rs",
  "crates/compass/src/domain/type_system/annotation.rs",
]
reason = "compass E1: the syntax model is tree-sitter's. ParsedFile wraps a tree_sitter::Tree, and the lint checkers, semantic visitors, CFG builder, type inference, type checker, semantic search and refactoring AST cache walk tree_sitter::Node directly on the hot path (about 20k lines). Only the core tree-sitter crate is used here; the 13 grammar crates stay in infrastructure/syntax. Long-term."

[[exceptions]]
rule = "B3"
subject = "interfaces->domain"
paths = [
  "crates/compass/src/interfaces/lsp/argus_server.rs",
  "crates/compass/src/interfaces/output/agent.rs",
  "crates/compass/src/interfaces/output/reporter.rs",
]
reason = "compass E2, long-term: these files read only the agent and LSP wire value objects. lsp/argus_server.rs converts Diagnostic, DiagnosticSeverity, Range and Position to and from lsp_types; output/agent.rs renders FileResult, DiagnosticSeverity and Range; output/reporter.rs renders FileResult, Diagnostic and DiagnosticSeverity. Symbol tables and the import graph reach the reporters as application report views, and the LSP server reads everything else through the application editor session."

