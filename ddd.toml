[[exceptions]]
rule = "B1"
subject = "surface"
paths = ["crates/surface/Cargo.toml"]
reason = "The shared kernel keeps its crate name while ui-runtime is a whole-src domain crate; SPEC-MANAGED, not split in P1 (ADR D18). P2: D8 moves ui-runtime to src/domain, which removes the split-crate naming rule."

[[exceptions]]
rule = "B1"
subject = "ui-runtime"
paths = ["crates/ui-runtime/Cargo.toml"]
reason = "SPEC-MANAGED crate kept whole in P1 (ADR D18), so it is a whole-src domain crate without the split-crate name. P2: D8 splits it into src/domain."

[[exceptions]]
rule = "B2"
subject = "base64"
paths = ["crates/claim-token/src/domain/claim_token.rs"]
reason = "base64url is the token's wire encoding, fixed by the format keep and loom already exchange; the crate is a pure encoder with no I/O. Long-term."

[[exceptions]]
rule = "B2"
subject = "jieba_rs"
paths = ["crates/index-text/src/domain/tokenize.rs"]
reason = "The Jieba analyzer is a persisted schema choice (Analyzer::Jieba) and jieba-rs is its segmentation algorithm over an embedded dictionary, with no I/O; it sits behind the optional `jieba` feature. Long-term."

[[exceptions]]
rule = "B3"
subject = "application->infrastructure"
paths = [
  "crates/storage-segment/src/application/paged_catalog/packing.rs",
  "crates/storage-segment/src/application/paged_catalog/page_store.rs",
]
reason = "Moved as-is in P1: PagedCatalog packs and stores pages through the page codec and put_immutable directly. P2: a CatalogPageStore port implemented in infrastructure."

[[exceptions]]
rule = "B3"
subject = "application->infrastructure"
paths = ["crates/storage-segment/src/application/archive.rs"]
reason = "Moved as-is in P1: ArchiveTransaction writes objects with put_immutable directly. P2: it writes through a port that infrastructure implements."

[[exceptions]]
rule = "B4"
subject = "storage-object.infrastructure"
paths = ["crates/storage-segment/src/domain/segment_error.rs"]
reason = "Moved as-is in P1: SegmentError::ObjectStore wraps ObjectStoreError via #[from]. P2: a domain-owned error variant, converted at the infrastructure boundary."

[[exceptions]]
rule = "B4"
subject = "storage-object.infrastructure"
paths = ["crates/storage-segment/src/domain/archive.rs"]
reason = "Moved as-is in P1: ArchivedObject.version is storage-object's ObjectVersion. P2: a domain-owned version type, or ObjectVersion moves into the shared kernel."

[[exceptions]]
rule = "B2"
subject = "anyhow"
paths = [
  "crates/service-projection/src/domain/projection.rs",
  "crates/service-projection/src/domain/source.rs",
]
reason = "Moved as-is in P1: the Projection, ProjectionSource and ProjectionReadSession ports return anyhow::Result, sift implements them, and validate_descriptor uses bail!. P2: the ports return a thiserror error (W3)."

[[exceptions]]
rule = "B2"
subject = "utoipa"
paths = [
  "crates/service-projection/src/domain/checkpoint.rs",
  "crates/service-projection/src/domain/lag.rs",
  "crates/service-projection/src/domain/projection.rs",
]
reason = "Moved as-is in P1: ProjectionDescriptor, ProjectionCheckpoint and ProjectionLag derive utoipa::ToSchema, and sift's OpenAPI document uses these schema names. P2: the schemas move to interfaces body types that keep the schema names."

[[exceptions]]
rule = "B2"
subject = "chrono::Utc::now"
paths = ["crates/service-projection/src/domain/checkpoint.rs"]
reason = "Moved as-is in P1: ProjectionCheckpoint::empty and the checkpoint builder stamp updated_at from the wall clock. P2: they take the time from a Clock port, which changes the empty() signature."

[[exceptions]]
rule = "B3"
subject = "application->infrastructure"
paths = [
  "crates/service-projection/src/application/handle.rs",
  "crates/service-projection/src/application/handle/locked.rs",
  "crates/service-projection/src/application/registry.rs",
]
reason = "Moved as-is in P1: ProjectionHandle restores, persists and quarantines its state file, and ProjectionRegistry sets the state root's mode, through direct calls to the file-state functions. P2: a projection state store port in domain, implemented in infrastructure."

[[exceptions]]
rule = "B2"
subject = "anyhow"
paths = [
  "crates/openapi-codegen/src/domain/emit/py.rs",
  "crates/openapi-codegen/src/domain/emit/rust.rs",
  "crates/openapi-codegen/src/domain/emit/ts.rs",
  "crates/openapi-codegen/src/domain/generation/file_bearer_auth.rs",
  "crates/openapi-codegen/src/domain/target.rs",
]
reason = "Moved as-is in P1: the per-language generate functions, FileBearerAuth::new and the target-profile parsers (TargetProfile::from_id, FromStr) return anyhow::Result and use bail!/anyhow!. P2: give the domain a thiserror error enum and convert to anyhow in application and infrastructure."

[[exceptions]]
rule = "B3"
subject = "interfaces->domain"
paths = ["crates/openapi-codegen/src/interfaces/cli.rs"]
reason = "Moved as-is in P1: the CLI entry `run` builds GenOptions and prints the MANIFEST_FILE path, both domain items, around its call to application::generate. P2: let application take a CLI request (spec path, output dir, language, client name) and return the written paths, so interfaces uses application only."

[[exceptions]]
rule = "B2"
subject = "anyhow"
paths = [
  "crates/service-backup/src/domain/destination.rs",
  "crates/service-backup/src/domain/policy.rs",
]
reason = "Moved as-is in P1: BackupDestination::from_uri and ScheduledBackupPolicy::to_runtime_policy return anyhow::Result, and TryFrom<&ScheduledBackupPolicy> for BackupPolicy has Error = anyhow::Error, which downstream operators match on. P2: a thiserror destination/policy error (W3)."

[[exceptions]]
rule = "B2"
subject = "schemars"
paths = [
  "crates/service-backup/src/domain/destination.rs",
  "crates/service-backup/src/domain/policy.rs",
]
reason = "Moved as-is in P1: BackupDestination, ScheduledBackupPolicy and RetentionPolicy derive schemars::JsonSchema because downstream CRDs embed them and their generated schemas must not change. P2: the schema derive moves to interfaces CRD body types, or stays as a documented long-term exception."

[[exceptions]]
rule = "B3"
subject = "application->infrastructure"
paths = [
  "crates/service-backup/src/application/admin_snapshot_backup.rs",
  "crates/service-backup/src/application/runner.rs",
]
reason = "Moved as-is in P1: run_backup_once takes &dyn BackupSink and run_admin_snapshot_backup calls fetch_admin_snapshot and sink_from_destination, all defined in infrastructure. P2: the BackupSink port and a snapshot source port move to domain, and the lenient fetch_admin_snapshot is deleted (W1)."

[[exceptions]]
rule = "B3"
subject = "interfaces->domain"
paths = ["crates/service-backup/src/interfaces/llm.rs"]
reason = "Moved as-is in P1: the LLM topic lists the supported destination schemes straight from the domain SUPPORTED_SCHEMES table so the text cannot drift from the parser. P2: the topic reads the schemes through an application query."

[[exceptions]]
rule = "B3"
subject = "application->infrastructure"
paths = [
  "crates/cli-std/src/application/connect.rs",
  "crates/cli-std/src/application/issue/comment.rs",
  "crates/cli-std/src/application/issue/create.rs",
  "crates/cli-std/src/application/issue/search.rs",
  "crates/cli-std/src/application/issue/view.rs",
  "crates/cli-std/src/application/upgrade.rs",
]
reason = "Moved as-is in P1: the connect, issue and upgrade use cases call the kubectl, GitHub, courier, terminal-prompt and self-install adapters directly. P2: define ports in domain that infrastructure implements, and inject them into the use cases."

[[exceptions]]
rule = "B2"
subject = "anyhow"
paths = ["crates/service-auth/src/domain/authorization/registry.rs"]
reason = "Moved as-is in P1: the public Registry::parse and Registry::try_merge return anyhow::Result built with bail! and Context, and the registry loaders and ReloadableRoleMapVerifier pass those errors on unchanged. P2: a thiserror RegistryError in domain, converted to anyhow::Error at the loaders."

[[exceptions]]
rule = "B3"
subject = "infrastructure->application"
paths = [
  "crates/service-auth/src/infrastructure/google/http.rs",
  "crates/service-auth/src/infrastructure/k8s/kube_backend.rs",
  "crates/service-auth/src/infrastructure/k8s/kube_token_minter.rs",
]
reason = "Moved as-is in P1: HttpJwksSource, HttpAccessTokenIntrospection, KubeReviewBackend and KubeTokenMinter implement the #[async_trait] ports JwksSource, AccessTokenIntrospection, ReviewBackend and TokenMinter, which B2 keeps out of domain, together with their request and outcome types; KubeTokenMinter also reads the k8s SystemClock, and GoogleVerifier::google() in http.rs wires the HTTP sources and a ReloadableRoleMapVerifier into a GoogleVerifier. P2: the ports and their value types move to domain as native async-fn traits, SystemClock becomes an infrastructure adapter behind the domain Clock port, and google() moves to an assembly constructor."

[[exceptions]]
rule = "B4"
subject = "service-auth.infrastructure"
paths = ["crates/service-backup/src/infrastructure/admin_snapshot/transport.rs"]
reason = "Moved as-is in P1: the admin snapshot transport authenticates with service_auth::k8s::ProjectedTokenFile, which reads a projected ServiceAccount token from disk and so sits in service-auth's infrastructure layer. P2: service-auth offers the projected token through an application-layer token source port, and service-backup depends on that."

[[exceptions]]
rule = "B2"
subject = "futures"
paths = [
  "crates/service-k8s/src/domain/certificate/issuer.rs",
  "crates/service-k8s/src/domain/certificate/secret_store.rs",
]
reason = "Moved as-is in P1: the Issuer and SecretStore ports return futures::future::BoxFuture so the reconciler can hold them as trait objects. P2: return Pin<Box<dyn Future<Output = T> + Send + 'a>> from std, the same type without the futures crate."

[[exceptions]]
rule = "B2"
subject = "rcgen"
paths = ["crates/service-k8s/src/domain/certificate/issuer.rs"]
reason = "Moved as-is in P1: IssuanceRequest::build generates the keypair and CSR with rcgen (generate_key_and_csr), and issuer.rs moved whole (336 lines, D17) with the Issuer port and its request types. P2: move keypair and CSR generation behind a port implemented in infrastructure, so the domain carries only the CSR PEM."

[[exceptions]]
rule = "B3"
subject = "application->infrastructure"
paths = ["crates/service-k8s/src/application/certificate/reconcile.rs"]
reason = "Moved as-is in P1: Reconciler reads and builds the Secret layout directly with infrastructure secret_layout::{read_state, material_secret, trust_bundle_secret}. P2: put the Secret layout behind a port (or the SecretStore port) that infrastructure implements."

[[exceptions]]
rule = "B2"
subject = "schemars"
paths = [
  "crates/service-k8s/src/domain/capacity.rs",
  "crates/service-k8s/src/domain/condition.rs",
  "crates/service-k8s/src/domain/lifecycle.rs",
]
reason = "Moved as-is in P1: ReplicaLayerPolicy, ShardSplitPolicy, Condition, ProbeTiming and LifecyclePolicy derive JsonSchema because service CRD specs and statuses embed them directly. P2: keep these as plain domain values and give the CRD wire shapes their own JsonSchema types in interfaces, converting at the boundary."

[[exceptions]]
rule = "B2"
subject = "chrono::Utc::now"
paths = ["crates/service-k8s/src/domain/condition.rs"]
reason = "Moved as-is in P1: now_rfc3339 reads the wall clock for the lastTransitionTime that project stamps; its only caller is the operator's reconcile, which already passes the result to project as `now`. P2: take the time from a Clock port (or move now_rfc3339 to the operator), so domain/condition.rs only receives `now`."

[[exceptions]]
rule = "B3"
subject = "interfaces->domain"
paths = [
  "crates/service-k8s/src/interfaces/operator/managed_service.rs",
  "crates/service-k8s/src/interfaces/operator/reconcile.rs",
]
reason = "Moved as-is in P1: the ManagedService trait hands back Condition and ConditionFact values, and the operator's reconcile builds ConditionFacts and projects them onto the CR status with project and now_rfc3339. P2: pull the reconcile sequence into an application use case behind the ports the mapping lists, so interfaces reaches the condition rules only through application."

[[exceptions]]
rule = "B3"
subject = "interfaces->infrastructure"
paths = ["crates/service-k8s/src/interfaces/operator.rs"]
reason = "Moved as-is in P1: the operator entry points run and reconcile_once create the leader Election, spawn the Lease renewal loop and keep the Election in the reconcile context, all from infrastructure::lease. P2: move the leadership rule (Election, may_acquire) into domain and start the Lease renewal from an application use case through a port that infrastructure implements."
