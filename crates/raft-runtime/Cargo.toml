[package]
name = "raft-runtime"
version = "0.1.0"
edition = "2021"
description = "Shared Raft runtime that drives raft-core for a service state machine over transport-h2c, including apply, snapshot, compaction, topology, and read-your-write proposal handling."

[lib]
name = "raft_runtime"
path = "src/lib.rs"

[dependencies]
raft-core = { path = "../raft-core" }
server-lifecycle = { path = "../server-lifecycle" }
storage-durable = { path = "../storage-durable" }
transport-h2c = { path = "../transport-h2c", features = ["server"] }
peer-tls = { path = "../peer-tls" }
cli-std = { path = "../cli-std", default-features = false }
anyhow = { workspace = true }
async-trait = { workspace = true }
axum = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = "0.10"
thiserror = { workspace = true }
crc32fast = "1"
memmap2 = "0.9"
tokio = { workspace = true }
tracing = { workspace = true }
rustls = "0.23"
tokio-rustls = "0.26"

[dev-dependencies]
rcgen = "0.13"
syn = { version = "2", features = ["full", "visit"] }
tempfile = "3"

[lints]
workspace = true
