[package]
name = "ui-runtime"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Renderer-neutral component runtime: hooks, fiber storage, mount, flush, and update scheduling over surface elements"

[features]
default = []
debug = ["ui-runtime-upstream/debug"]

[dependencies]
ui-runtime-upstream = { package = "ui-runtime", git = "https://github.com/faberline/surface", rev = "1754a2e96e487ea693be558041abdf21ffc63d27", default-features = false }

[dev-dependencies]
surface = { path = "../surface" }
surface-upstream = { package = "surface", git = "https://github.com/faberline/surface", rev = "1754a2e96e487ea693be558041abdf21ffc63d27" }

[lints]
workspace = true
