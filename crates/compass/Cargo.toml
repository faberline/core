[package]
name = "compass"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Code intelligence arsenal — navigate, analyze, refactor, and watch any codebase"

[lib]
name = "compass"
path = "src/lib.rs"

[dependencies]
# Serialization
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
toml = "0.8"

# Error handling
anyhow.workspace = true
thiserror.workspace = true

# Regex
regex.workspace = true
regex-lite = "0.1"

# Async runtime (LSP server + Argus daemon)
tokio.workspace = true

# AST parsing (tree-sitter)
tree-sitter = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-python = "0.25"
tree-sitter-javascript = "0.25"
tree-sitter-typescript = "0.23"
tree-sitter-go = "0.25"
tree-sitter-html = "0.23"
tree-sitter-css = "0.25"
tree-sitter-hcl = "1.1"
tree-sitter-yaml = "0.7"
tree-sitter-sequel = "0.3"
tree-sitter-proto = "0.4"
tree-sitter-graphql = "0.1"
tree-sitter-toml-ng = "0.7"

# LSP server
tower-lsp = "0.20"

# File watching
notify = "7"

# Persistent cache
bincode = "1.3"

# Parallelism
rayon.workspace = true
jwalk.workspace = true

# Logging
tracing.workspace = true

# JSON Schema (infrastructure/schema_validation/ for K8s + GitLab CI validation)
jsonschema = "0.29"

# HTTP client (infrastructure/typeshed/ downloads)
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
