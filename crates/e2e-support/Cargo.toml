[package]
name = "e2e-support"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
publish = false
description = "Shared end-to-end test harness for Faberline service repos: pure checks (identity, pool placement, evidence) and the kubectl, wait and HTTP helpers."

[lib]
name = "e2e_support"
path = "src/lib.rs"

[dependencies]
serde_json = { workspace = true }
reqwest = { workspace = true }
tokio = { workspace = true }
# ring, not the default aws-lc-rs: service-k8s already builds rustls with ring
# (kube). Two providers in one test binary make rustls refuse to pick one.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }

[dev-dependencies]
rcgen = { version = "0.13", features = ["pem", "x509-parser"] }
time = { version = "0.3", default-features = false }

[lints]
workspace = true
