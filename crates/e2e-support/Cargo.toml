[package]
name = "e2e-support"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
publish = false
description = "Shared end-to-end test harness for Faberline service repos: pure checks (identity, pool placement, evidence) and the kubectl, wait and HTTP helpers."

[lib]
name = "e2e_support"
path = "src/lib.rs"

[dependencies]
serde_json = { workspace = true }
reqwest = { workspace = true }
tokio = { workspace = true }
rustls = "0.23"
tokio-rustls = "0.26"

[dev-dependencies]
rcgen = { version = "0.13", features = ["pem", "x509-parser"] }
time = { version = "0.3", default-features = false }

[lints]
workspace = true
