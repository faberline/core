# cargo-deny configuration
# Run with: cargo deny check
# Docs: https://embarkstudios.github.io/cargo-deny/

[graph]
targets = []
all-features = false
no-default-features = false

[advisories]
db-path = "~/.cargo/advisory-db"
version = 2
# Ignore only these advisories. Each has no fixed upgrade; re-check by 2027-02-16 (desk decision, faberline/core#353).
ignore = [
    { id = "RUSTSEC-2025-0012", reason = "backoff is unmaintained; no fixed upgrade. Re-check by 2027-02-16." },
    { id = "RUSTSEC-2026-0543", reason = "chrono is unmaintained; no fixed upgrade. Re-check by 2027-02-16." },
    { id = "RUSTSEC-2024-0384", reason = "instant is unmaintained; no fixed upgrade. Re-check by 2027-02-16." },
    { id = "RUSTSEC-2025-0134", reason = "rustls-pemfile is unmaintained; no fixed upgrade. Its replacement is a separate issue. Re-check by 2027-02-16." },
    { id = "RUSTSEC-2024-0449", reason = "unsafe-libyaml is unmaintained; no fixed upgrade. Re-check by 2027-02-16." },
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
    "Unlicense",
    "OpenSSL",
    "CDDL-1.0",
    "CDLA-Permissive-2.0",
    "MIT-0",
]
confidence-threshold = 0.8

[[licenses.clarify]]
name = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [
    { path = "LICENSE", hash = 0xbd0eed23 },
]

[bans]
multiple-versions = "warn"
wildcards = "allow"  # Allow path dependencies in workspace
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
